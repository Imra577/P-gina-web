<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="ejemplo.css">
    <link rel="stylesheet" href="menu.css">
    <script src="script.js" defer></script>
</head>





<body>
    <header>
        <h1 style="text-align: center;">Calculadora</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="horario.html">Horario</a>
            <a href="formulario.html">Formulario</a>
            <a href="Tema3/ejemplo.html">Calculadora</a>
            <details class="menu-ejercicios">
                <summary>Ejercicios</summary>
                <div class="submenu">
                    <ul>
                        <li><a href="ACT1.html">Ejercicio 1</a></li>
                        <li><a href="ACT2.html">Ejercicio 2</a></li>
                        <li><a href="ACT3.html">Ejercicio 3</a></li>
                        <li><a href="ACT1pdf2.html">Ejercicio 4</a></li>
                        <li><a href="ACT2pdf2.html">Ejercicio 5</a></li>
                     </ul>
                </div>
            </details>
        </nav>
    </header>
    <br>
    <div class="contenedor">
        <input id="pantalla" type="text" readonly>

        <div class="botones">
            <button class="clear" data-value="C">C</button>
            <button data-value="/" class="operacion">/</button>
            <button data-value="*" class="operacion">*</button>
            <button data-value="-" class="operacion">−</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="+" class="operacion">+</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="(" class="operacion">(</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value=")" class="operacion">)</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button data-value="=" class="igual">=</button>
        </div>
    </div>
</body>
</html>
